name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject; 3.13 catches deprecations early.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # A venv rather than `--system`: the runner's system interpreter is
      # externally managed (PEP 668), and installing into it also ignores the
      # matrix version, so every job would silently test the same Python.
      - name: Create venv on Python ${{ matrix.python-version }}
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install project
        run: uv pip install -e ".[dev]"

      - name: Confirm the interpreter matches the matrix
        run: uv run python -c "import sys; print(sys.version)"

      # The suite must pass with no Ollama, no API keys, and no network.
      # Every optional dependency has a documented fallback; if a test needs
      # one of them, that is the bug.
      - name: Run tests
        run: uv run python -m pytest

      - name: Check the CLI loads and reports honestly
        run: |
          uv run python -m ai_researcher.cli --help
          uv run ai-researcher sources
